services:
  crypto-mainnet:
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-alpha-engine:latest
    container_name: crypto-mainnet
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FF_ENABLE_ANOMALY_CAPSULE=false
      - FF_AUTO_CLOSE_ANOMALIES_WHEN_DISABLED=true
      - FF_ENABLE_HARD_EQUITY_FLOOR=true
      - FF_EQUITY_FLOOR_USD=2500.0
      - FF_ENABLE_INTRACYCLE_REBALANCE=false
      - FF_ENABLE_INVARIANT_AUDIT=true
      - FF_ENABLE_SUBHOURLY_PULLBACK=false
      - FF_ENABLE_CHOP_RANGE_ARB=true
      - FF_ENABLE_DYNAMIC_BARRIERS=true
      - FF_CHOP_PROFIT_LOCK_TRIGGER_PCT=0.024
      - FF_CHOP_PROFIT_LOCK_LEVEL_PCT=0.012
      - FF_ENABLE_HOLISTIC_REGIME_SHIELDS=true
    command: ["python", "scripts/run_trading.py", "--daemon", "--mainnet", "--capital", "3000", "--rebalance-interval", "28800", "--align-funding-clock", "--bhs-enter-top-k", "3", "--bhs-hold-top-k", "6", "--deadband-mult", "1.25", "--start-leverage", "2.5", "--recovery-boost-equity", "3050.0", "--recovery-boost-leverage", "3.2", "--max-leverage", "5.0", "--dd-bracket", "0.06", "--disable-anomalies", "--equity-floor-usd", "2500.0"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  crypto-shadow:
    image: crypto-alpha-engine:latest
    pull_policy: never
    container_name: crypto-shadow
    restart: unless-stopped
    profiles: ["shadow"]
    env_file:
      - .env
    command: ["python", "scripts/run_trading.py", "--daemon", "--shadow", "--capital", "3000"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # Opcional: Túnel Zero-Trust saliente con Cloudflare (0 puertos entrantes abiertos)
  # Se activa automáticamente con: docker compose --profile cloudflare up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: crypto-cloudflared
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
